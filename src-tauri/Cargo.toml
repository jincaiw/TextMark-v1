[package]
name = "textmark"
version = "0.4.0"
description = "A fast, secure, cross-platform Markdown reader and editor"
authors = ["TextMark contributors"]
license = "MIT"
repository = "https://github.com/jincaiw/TextMark-v1"
edition = "2024"

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "textmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10"
tauri-plugin-single-instance = "2.4"
tauri-plugin-process = "2.3"
base64 = "0.22"
mime_guess = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
notify = "8"
atomic-write-file = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
font8x8 = "0.3"
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }
tauri-plugin-wdio = "1.3"
