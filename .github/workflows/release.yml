name: Release TextMark

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: --target universal-apple-darwin
          - os: windows-latest
            args: --target x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            args: --target x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS Universal 2 target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --include=dev
      - run: npm test && npm run build && cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: TextMark ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $binary = Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release -Filter TextMark.exe -Recurse | Select-Object -First 1
          if ($null -eq $binary) { throw "TextMark.exe was not produced by the Windows build." }
          $archive = "TextMark_${version}_windows_x64_portable.zip"
          Compress-Archive -Path $binary.FullName -DestinationPath $archive -Force
          gh release upload $tag $archive --clobber
        env:
          GH_TOKEN: ${{ github.token }}
